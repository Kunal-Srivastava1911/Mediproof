# Render Blueprint for the MediProof stack (FastAPI API + static React UI).
#
# Deploy: render.com -> New + -> Blueprint -> connect this GitHub repo -> Apply.
# Both services build straight from the repo; the UI's VITE_API_BASE is wired to the
# API's public host automatically (see fromService below).
#
# Free-plan caveats (fine for a demo, call them out to viewers):
#   - services sleep after ~15 min idle, so the first request after a nap cold-starts;
#   - the API's SQLite DB + uploaded PDFs live on ephemeral disk and reset on any
#     restart/redeploy. For durable data, give mediproof-api a paid disk mounted at
#     /data, or point DATABASE_URL at a managed Postgres (the schema is PG-compatible).
services:
  - type: web
    name: mediproof-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    dockerCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # Live AI: set GEMINI_API_KEY in the Render dashboard (sync: false = never stored in
      # this file). Every call races the LLM_RACE_MODELS; the first reply whose quotes are all
      # found in the documents wins. If none has one after LLM_RACE_PATIENCE_S, the
      # LLM_RACE_FALLBACK model joins (Google's newest models are often overloaded on the free
      # tier). LLM_PREFER_LIVE=1 calls the models even for the test pack and uses the committed
      # recordings only if every live call fails (set LLM_LIVE=0 to serve them with no key).
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_LIVE
        value: "1"
      - key: LLM_RACE_MODELS
        value: gemini-3.8-flash,gemini-3.6-flash
      - key: LLM_RACE_FALLBACK
        value: gemini-3.5-flash-lite
      - key: LLM_RACE_PATIENCE_S
        value: "45"
      - key: LLM_PREFER_LIVE
        value: "1"
      - key: PORT
        value: "8000"
      - key: LLM_BUDGET_USD
        value: "1.00"

  - type: web
    name: mediproof-ui
    runtime: static
    buildCommand: cd ui && npm install && npm run build
    staticPublishPath: ui/dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: mediproof-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
